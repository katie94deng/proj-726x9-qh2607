<!-- 防复制防盗全套代码，优化：仅禁止文本选中，不影响按钮/弹窗交互 -->
<style>
body {
  user-select: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
}
/* 按钮、弹窗允许点击选择文字，避免交互失效 */
button, .popup, input {
  user-select: text;
  -webkit-user-select: text;
}
</style>
<script>
let devOpen = false;
document.addEventListener('contextmenu', e=>e.preventDefault())
document.addEventListener('copy', e=>e.preventDefault())
document.addEventListener('cut', e=>e.preventDefault())
document.addEventListener('keydown', e=>{
  if(e.keyCode === 123) e.preventDefault()
  if(e.ctrlKey && e.key.toLowerCase() === 'u') e.preventDefault()
  if(e.ctrlKey && e.shiftKey && ['i','j','c'].includes(e.key.toLowerCase())) e.preventDefault()
})
function checkDev() {
  const wGap = window.outerWidth - window.innerWidth;
  const hGap = window.outerHeight - window.innerHeight;
  if(wGap > 120 || hGap > 120) devOpen = true;
  if(devOpen) window.location.href = "about:blank";
}
setInterval(checkDev, 600)
</script>

            }
        }

        // ====================== 2. 本地存档系统 ======================
        let userData = {
            basic: {
                coins: 50,
                light: 0,
                unlockPlots:3,
                completeLevel: {}, // {food:{1:true,2:true}}
                wrongList: []
            },
            farm: {
                plots: [
                    {id:0,status:"empty",crop:null,plantTime:0},
                    {id:1,status:"empty",crop:null,plantTime:0},
                    {id:2,status:"empty",crop:null,plantTime:0},
                    {id:3,status:"lock",crop:null,plantTime:0},
                    {id:4,status:"lock",crop:null,plantTime:0},
                    {id:5,status:"lock",crop:null,plantTime:0},
                    {id:6,status:"lock",crop:null,plantTime:0},
                    {id:7,status:"lock",crop:null,plantTime:0},
                ]
            },
            bag: {
                seed: {cabbage:3,tomato:2,wheat:0,strawberry:0},
                ingredient: {}
            }
        }
        function saveData(){
            localStorage.setItem("qinghe_save",JSON.stringify(userData))
        }
        function loadData(){
            const save = localStorage.getItem("qinghe_save")
            if(save) userData = JSON.parse(save)
        }
        // ====================== 3. 页面切换渲染（新增导航高亮修复函数） ======================
        function switchNav(pageId, btnDom){
            document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"))
            document.getElementById(pageId).classList.add("active")
            document.querySelectorAll(".nav-btn").forEach(btn=>btn.classList.remove("active"))
            btnDom.classList.add("active")
            renderFarm()
        }
        function switchPage(pageId){
            document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"))
            document.getElementById(pageId).classList.add("active")
            renderFarm()
        }
        function renderResource(){
            document.getElementById("coin-num").innerText = userData.basic.coins
            document.getElementById("light-num").innerText = userData.basic.light
        }
        // 渲染农田，修复倒计时负数问题
        function renderFarm(){
            renderResource()
            const gridWrap = document.getElementById("farm-plots")
            gridWrap.innerHTML = ""
            const nowSec = Math.floor(Date.now() / 1000);
            userData.farm.plots.forEach((p,idx)=>{
                const div = document.createElement("div")
                div.className = "plot"
                if(p.status == "lock"){
                    div.classList.add("locked")
                    const cost = plotCost[idx]
                    div.innerHTML = `<div>🔒</div><div>${cost}✨解锁</div>`
                    div.onclick = ()=>unlockPlot(idx)
                }else if(p.status == "empty"){
                    div.innerHTML = `<div>空地</div><div>点击播种</div>`
                    div.onclick = ()=>openSeedSelect(idx)
                }else if(p.status == "planting"){
                    const crop = cropConfig[p.crop]
                    const end = p.plantTime + crop.growTime
                    let left = Math.ceil(end - nowSec)
                    if(left < 0) left = 0
                    if(left <=0){
                        div.innerHTML = `<div>${crop.name}</div><div>点击收获</div>`
                        div.onclick = ()=>harvestPlot(idx)
                    }else{
                        div.classList.add("planting")
                        div.innerHTML = `<div>🌱${crop.name}</div><div>${left}秒成熟</div>`
                    }
                }
                gridWrap.appendChild(div)
            })
        }
        // 解锁地块
        function unlockPlot(idx){
            const cost = plotCost[idx]
            if(userData.basic.light < cost){
                showTip(`光粒不足，需要${cost}✨`)
                return
            }
            userData.basic.light -= cost
            userData.farm.plots[idx].status = "empty"
            saveData()
            renderFarm()
            showTip("成功解锁新地块！")
        }
        // 播种弹窗
        function openSeedSelect(plotIdx){
            closeMask()
            const mask = document.getElementById("mask-box")
            let html = `<div class="mask"><div class="popup"><div class="popup-title">选择种子播种</div>`
            let hasSeed = false
            for(let s in userData.bag.seed){
                const num = userData.bag.seed[s]
                if(num > 0){
                    hasSeed = true
                    const c = cropConfig[s]
                    html += `<div class="item-row"><span>${c.name}种子 x${num}</span><button class="btn" onclick="plantSeed(${plotIdx},'${s}')">播种</button></div>`
                }
            }
            if(!hasSeed) html += `<p class="tips-text">暂无种子，去英语挑战获取吧</p>`
            html += `<button class="btn close-btn" onclick="closeMask()">关闭</button></div></div>`
            mask.innerHTML = html
        }
        function plantSeed(plotIdx,seedId){
            if(userData.bag.seed[seedId] <= 0) return
            userData.bag.seed[seedId] -= 1
            const plot = userData.farm.plots[plotIdx]
            plot.status = "planting"
            plot.crop = seedId
            plot.plantTime = Math.floor(Date.now()/1000)
            saveData()
            closeMask()
            renderFarm()
            showTip("播种完成，等待成熟")
        }
        // 收获
        function harvestPlot(idx){
            const p = userData.farm.plots[idx]
            const c = cropConfig[p.crop]
            if(!userData.bag.ingredient[c.crop]) userData.bag.ingredient[c.crop] = 0
            userData.bag.ingredient[c.crop] += Math.floor(Math.random()*3)+1
            p.status = "empty"
            p.crop = null
            p.plantTime = 0
            saveData()
            renderFarm()
            showTip(`收获${c.name}食材`)
        }
        // ====================== 4. 答题系统 ======================
        let quizData = {
            curScene: "",
            curLevel: 1,
            curQ:0,
            allQ: [],
            rightNum:0
        }
        // 打开场景列表
        function openSceneList(){
            switchPage("scene-page")
            const listWrap = document.getElementById("scene-list")
            listWrap.innerHTML = ""
            sceneConfig.forEach(scene=>{
                let lock = false
                let lockText = ""
                if(scene.unlock == "foodAllClear"){
                    if(!(userData.basic.completeLevel["food"] && userData.basic.completeLevel["food"][3])){
                        lock = true
                        lockText = "通关饮食就餐全部关卡解锁"
                    }
                }
                if(scene.unlock == "homeAllClear"){
                    if(!(userData.basic.completeLevel["home"] && userData.basic.completeLevel["home"][3])){
                        lock = true
                        lockText = "通关居家生活全部关卡解锁"
                    }
                }
                let levelText = ""
                const complete = userData.basic.completeLevel[scene.id] || {}
                for(let i=1;i<=scene.levelTotal;i++){
                    levelText += complete[i] ? `✅${i}` : `❌${i}`
                }
                const div = document.createElement("div")
                div.className = lock ? "scene-item scene-locked" : "scene-item"
                div.innerHTML = `
                    <div>
                        <div style="font-weight:bold">${scene.name}</div>
                        <div style="font-size:13px;margin-top:4px">关卡进度：${levelText}</div>
                        ${lock?`<div style="font-size:12px;color:#999">${lockText}</div>`:""}
                    </div>
                    ${lock ? "" : `<button class="btn btn-green" onclick="startLevel('${scene.id}',1)">开始闯关</button>`}
                `
                listWrap.appendChild(div)
            })
        }
        // 开启关卡
        function startLevel(sceneId,level){
            quizData.curScene = sceneId
            quizData.curLevel = level
            quizData.curQ = 0
            quizData.rightNum = 0
            quizData.allQ = [...questionBank[sceneId][level]]
            switchPage("quiz-page")
            document.getElementById("quiz-scene-name").innerText = sceneConfig.find(s=>s.id==sceneId).name + ` 第${level}关`
            renderQuestion()
        }
        function exitQuiz(){
            openSceneList()
        }
        function renderQuestion(){
            const idx = quizData.curQ
            const q = quizData.allQ[idx]
            document.getElementById("cur-q-num").innerText = idx+1
            document.getElementById("quiz-progress").style.width = ((idx)/quizData.allQ.length*100)+"%"
            const qBox = document.getElementById("question-content")
            const optBox = document.getElementById("option-container")
            optBox.innerHTML = ""
            if(q.type == "choice_word" || q.type == "choice_scene" || q.type == "choice_dialog"){
                qBox.innerText = q.q
                q.opts.forEach((opt,i)=>{
                    const btn = document.createElement("button")
                    btn.className = "option-item"
                    btn.innerText = opt
                    btn.onclick = ()=>checkAnswer(i)
                    optBox.appendChild(btn)
                })
            }else if(q.type == "sort"){
                // 修复：每次分类题重置两个篮子，清空残留单词
                qBox.innerHTML = `<div>分类题：请选出属于【${q.sortType}】的单词</div>
                <div class="sort-box">
                    <div class="sort-basket" id="sort-right">目标类别</div>
                    <div class="sort-basket" id="sort-other">其他</div>
                </div>
                <div id="sort-word-list"></div>`
                const wordWrap = document.getElementById("sort-word-list")
                wordWrap.innerHTML = ""
                q.words.split(",").forEach(w=>{
                    const span = document.createElement("span")
                    span.className = "sort-word-item"
                    span.innerText = w
                    span.draggable = true
                    span.ondragstart = (e)=>e.dataTransfer.setData("word",w)
                    wordWrap.appendChild(span)
                })
                // 拖拽容器
                const rightBox = document.getElementById("sort-right")
                const otherBox = document.getElementById("sort-other")
                rightBox.innerHTML = "目标类别"
                otherBox.innerHTML = "其他"
                rightBox.ondragover = e=>e.preventDefault()
                otherBox.ondragover = e=>e.preventDefault()
                rightBox.ondrop = (e)=>{
                    e.preventDefault()
                    const w = e.dataTransfer.getData("word")
                    rightBox.innerHTML += `<span class="sort-word-item">${w}</span>`
                }
                otherBox.ondrop = (e)=>{
                    e.preventDefault()
                    const w = e.dataTransfer.getData("word")
                    otherBox.innerHTML += `<span class="sort-word-item">${w}</span>`
                }
                const submitBtn = document.createElement("button")
                submitBtn.className = "btn"
                submitBtn.innerText = "提交分类"
                submitBtn.onclick = ()=>checkSort(q)
                optBox.appendChild(submitBtn)
            }
        }
        // 判断单选答案
        function checkAnswer(selectIdx){
            const q = quizData.allQ[quizData.curQ]
            if(selectIdx == q.ans){
                quizData.rightNum +=1
                userData.basic.light += 1
                // 概率掉落种子
                const sceneSeed = sceneConfig.find(s=>s.id == quizData.curScene)
                let seedPool = []
                if(quizData.curScene == "food") seedPool = ["cabbage","tomato"]
                if(quizData.curScene == "home") seedPool = ["wheat"]
                if(quizData.curScene == "shop") seedPool = ["strawberry"]
                if(Math.random() < 0.1){
                    const randSeed = seedPool[Math.floor(Math.random()*seedPool.length)]
                    userData.bag.seed[randSeed] +=1
                    showTip(`答对！获得1光粒，掉落${cropConfig[randSeed].name}种子`)
                }else{
                    showTip("答对，+1光粒✨")
                }
            }else{
                userData.basic.wrongList.push(q.id)
                showTip(`答错啦，正确答案：${q.opts[q.ans]} ${q.desc||""}`)
            }
            nextQuestion()
        }
        // 判断分类题
        function checkSort(q){
            const rightBox = document.getElementById("sort-right")
            const selectWords = Array.from(rightBox.querySelectorAll(".sort-word-item")).map(d=>d.innerText)
            const rightArr = q.right
            let correct = true
            if(selectWords.length != rightArr.length) correct = false
            rightArr.forEach(w=>{
                if(!selectWords.includes(w)) correct = false
            })
            if(correct){
                quizData.rightNum +=1
                userData.basic.light += 1
                showTip("分类正确，+1光粒✨")
            }else{
                userData.basic.wrongList.push(q.id)
                showTip(`分类错误，正确单词：${rightArr.join(",")}`)
            }
            nextQuestion()
        }
        // 下一题 / 结算关卡
        function nextQuestion(){
            quizData.curQ += 1
            if(quizData.curQ >= quizData.allQ.length){
                // 关卡结算
                let coinGet = 5
                let rareSeed = null
                // 简化全对判断逻辑
                if(quizData.rightNum === quizData.allQ.length){
                    coinGet +=10
                    const s = quizData.curScene
                    if(s === "food") rareSeed = "tomato"
                    if(s === "home") rareSeed = "wheat"
                    if(s === "shop") rareSeed = "strawberry"
                    userData.bag.seed[rareSeed] += 1
                }
                userData.basic.coins += coinGet
                // 标记关卡通关
                if(!userData.basic.completeLevel[quizData.curScene]) userData.basic.completeLevel[quizData.curScene] = {}
                userData.basic.completeLevel[quizData.curScene][quizData.curLevel] = true
                saveData()
                closeMask()
                const mask = document.getElementById("mask-box")
                mask.innerHTML = `<div class="mask"><div class="popup">
                    <div class="popup-title">关卡完成！</div>
                    <p>答对${quizData.rightNum}/10题</p>
                    <p>金币+${coinGet}</p>
                    ${rareSeed ? `<p>全对奖励：${cropConfig[rareSeed].name}种子x1</p>`:""}
                    <button class="btn close-btn" onclick="openSceneList()">返回场景</button>
                </div></div>`
                return
            }
            renderQuestion()
            saveData()
        }
        // ====================== 5. 背包、错题本、弹窗 ======================
        function openBag(){
            closeMask()
            const mask = document.getElementById("mask-box")
            let seedHtml = ""
            let ingHtml = ""
            for(let s in userData.bag.seed){
                const num = userData.bag.seed[s]
                const c = cropConfig[s]
                seedHtml += `<div class="item-row"><span>${c.name}种子</span><span>x${num}</span></div>`
            }
            for(let i in userData.bag.ingredient){
                const num = userData.bag.ingredient[i]
                const c = cropConfig[i]
                ingHtml += `<div class="item-row"><span>${c.name}食材</span><span>x${num}</span>
                <button class="btn" onclick="sellIng('${i}')">出售${c.sellPrice}金币</button></div>`
            }
            mask.innerHTML = `<div class="mask"><div class="popup">
                <div class="popup-title">背包仓库</div>
                <h4>种子</h4>${seedHtml}
                <h4 style="margin-top:10px">食材</h4>${ingHtml||"<p>暂无食材</p>"}
                <button class="btn close-btn" onclick="closeMask()">关闭</button>
            </div></div>`
        }
        function sellIng(id){
            const num = userData.bag.ingredient[id]
            if(num <=0) return
            const price = cropConfig[id].sellPrice
            userData.basic.coins += price
            userData.bag.ingredient[id] -=1
            if(userData.bag.ingredient[id] <=0) delete userData.bag.ingredient[id]
            saveData()
            openBag() // 修复出售后实时刷新背包界面
            showTip(`出售成功，+${price}金币`)
        }
        function openWrongBook(){
            closeMask()
            const mask = document.getElementById("mask-box")
            let wrongHtml = ""
            const wrongIds = [...new Set(userData.basic.wrongList)]
            if(wrongIds.length ==0){
                wrongHtml = "<p>暂无错题，太棒啦！</p>"
            }else{
                outer:for(let s in questionBank){
                    for(let l in questionBank[s]){
                        const qs = questionBank[s][l]
                        for(let q of qs){
                            if(wrongIds.includes(q.id)){
                                wrongHtml += `<div class="item-row">${q.q}</div>`
                            }
                        }
                    }
                }
            }
            mask.innerHTML = `<div class="mask"><div class="popup">
                <div class="popup-title">错题本</div>
                ${wrongHtml}
                <button class="btn close-btn" onclick="closeMask()">关闭</button>
            </div></div>`
        }
        function closeMask(){
            document.getElementById("mask-box").innerHTML = ""
        }
        function showTip(text){
            closeMask()
            const mask = document.getElementById("mask-box")
            mask.innerHTML = `<div class="mask" onclick="closeMask()"><div class="popup" style="width:70%;text-align:center;padding:16px">${text}</div></div>`
            setTimeout(()=>closeMask(),1800)
        }
        // 游戏初始化
        function initGame(){
            loadData()
            renderFarm()
        }
        window.onload = initGame
    </script>
</body>
</html>
